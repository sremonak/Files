name: Build Android APK

on:
  push:
    branches: ["arena/f69e8e40-files"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_MODE=owner-key" >> "$GITHUB_ENV"
            echo "Owner signing key configured." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$RELEASE_KEYSTORE_BASE64$RELEASE_STORE_PASSWORD$RELEASE_KEY_ALIAS$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are incomplete. Configure all four secrets, or remove all four to use a temporary key."
            exit 1
          else
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 \
              -storepass "$password" -keypass "$password" -alias temporary \
              -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Temporary Files Pro build" -noprompt
            echo "RELEASE_STORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=temporary" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=temporary-key" >> "$GITHUB_ENV"
            echo "Temporary signing key: this APK is for testing only. Every run has a different key and cannot update an earlier installation. Uninstalling deletes app-private data including trash." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Test and build APKs
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Report build diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          log = Path('build.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              relevant = [line for line in lines if re.search(r'(^e: |^error: |^\* What went wrong:|^> [^T]|^Caused by:|FAILURE:|^Execution failed)', line, re.I)]
              text = '\n'.join(relevant[:40]) or '\n'.join(lines[-40:])
              text = text[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Gradle build diagnostics::{text}')
          PYCODE
      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Pro-release-${{ env.SIGNING_MODE }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
