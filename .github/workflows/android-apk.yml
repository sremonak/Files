name: Build Android APK

on:
  push:
    branches: ["arena/f69e8e40-files"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Report build diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          log = Path('build.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              relevant = [line for line in lines if re.search(r'(^e: |^error: |^\* What went wrong:|^> |^Caused by:|FAILURE:|^Execution failed)', line, re.I)]
              text = '\n'.join(relevant[:40]) or '\n'.join(lines[-40:])
              text = text[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Gradle build diagnostics::{text}')
          PYCODE
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-Pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
